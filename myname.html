    const countrySelect = document.getElementById('countrySelect');
    const stateSelect = document.getElementById('stateSelect');
    const districtSelect = document.getElementById('districtSelect');
    const placesList = document.getElementById('placesList');
    const summaryText = document.getElementById('summaryText');

    function populateStates() {
      const countryKey = countrySelect.value;
      const states = Object.keys(data[countryKey] || {});
      stateSelect.innerHTML = '';

      states.forEach((stateName) => {
        const option = document.createElement('option');
        option.value = stateName;
        option.textContent = stateName;
        stateSelect.appendChild(option);
      });

      if (states.length > 0) {
        stateSelect.value = states[0];
        populateDistricts();
      } else {
        districtSelect.innerHTML = '';
        renderPlaces([]);
      }
    }

    function populateDistricts() {
      const countryKey = countrySelect.value;
      const stateKey = stateSelect.value;
      const districtData = data[countryKey]?.[stateKey]?.districts || {};
      const districtNames = Object.keys(districtData);
      districtSelect.innerHTML = '';

      districtNames.forEach((districtName) => {
        const option = document.createElement('option');
        option.value = districtName;
        option.textContent = districtName;
        districtSelect.appendChild(option);
      });

      if (districtNames.length > 0) {
        districtSelect.value = districtNames[0];
      }

      updateSummaryAndPlaces();
    }

    function updateSummaryAndPlaces() {
      const countryLabel = countrySelect.options[countrySelect.selectedIndex]?.text || '';
      const stateLabel = stateSelect.value || 'N/A';
      const districtLabel = districtSelect.value || 'N/A';
      summaryText.textContent = `Country: ${countryLabel} � State: ${stateLabel} � District: ${districtLabel}`;

      const selectedPlaces = getSelectedPlaces();
      renderPlaces(selectedPlaces);
    }

    function getSelectedPlaces() {
      const countryKey = countrySelect.value;
      const stateKey = stateSelect.value;
      const districtKey = districtSelect.value;
      const districtPlaces = data[countryKey]?.[stateKey]?.districts?.[districtKey] || [];
      return districtPlaces.slice(0, 10);
    }

    function renderPlaces(places) {
      placesList.innerHTML = '';
      if (!places.length) {
        placesList.innerHTML = '<div class="no-results">No tourist place data is available for the selected state and district.</div>';
        return;
      }

      places.forEach((place, index) => {
        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <h3>${index + 1}. ${place.name}</h3>
          <p><strong>State:</strong> ${place.state}</p>
          <p><strong>District:</strong> ${place.district}</p>
          <p><strong>Google map location:</strong> <a href="${place.map}" target="_blank" rel="noopener noreferrer">View on Google Maps</a></p>
          <p><strong>Why it is top 10:</strong> ${place.reason}</p>
          <p><strong>Age group:</strong> ${place.ageGroup}</p>
        `;
        placesList.appendChild(card);
      });
    }

    countrySelect.addEventListener('change', () => {
      populateStates();
    });

    stateSelect.addEventListener('change', () => {
      populateDistricts();
    });

    districtSelect.addEventListener('change', () => {
      updateSummaryAndPlaces();
    });

    populateStates();
