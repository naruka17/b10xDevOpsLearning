<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }
    h1 {
      margin-top: 0;
      color: #1e3a8a;
    }
    p {
      line-height: 1.7;
      color: #4b5563;
    }
    .highlight {
      display: inline-block;
      margin-top: 20px;
      padding: 16px 18px;
      background: #eef2ff;
      border-left: 4px solid #6366f1;
      border-radius: 12px;
      color: #1e40af;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to the Home Page</h1>
    <p>This is the default page that appears when the master page loads. From the master page, you can switch between this Home Page and the existing MyName Page.</p>
    <div class="highlight">
      Tip: Open <strong>master.html</strong> to load this page automatically, then click the buttons to navigate.
    </div>
  </div>
</body>
</html>
